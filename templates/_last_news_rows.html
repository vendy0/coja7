{% for item in recent_items %}
<a class="row" href="{{ item.url }}" style="text-decoration:none;color:inherit;{% if loop.last %}border-bottom:none;{% endif %}">
  <div class="content">
    <div class="eyebrow tone-{{ item.tone }}">{{ item.eyebrow }}</div>
    <h4>{{ item.title }}</h4>
    <div class="date">{{ item.date | date_fr }}</div>
  </div>
</a>
{% endfor %}
