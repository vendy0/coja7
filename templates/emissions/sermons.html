{% extends "base.html" %}

{% block content %}
    <div class="page-intro">
      <h1>Sermons</h1>
      <p>Prédications</p>
    </div>

    <div class="search-bar-wrap">
      <input type="search" class="search-bar-input" placeholder="Rechercher un sermon…"
             data-search-index-url="{{ url_for('emissions.sermons_search_index') }}"
             data-search-mode="dropdown"
             data-search-keys="title,subtitle,reference"
             data-search-list-id="sermons-search-suggestions"
             data-search-url-template="{{ url_for('emissions.sermon_detail', sermon_id='__ID__') }}">
      <div class="search-suggestions" id="sermons-search-suggestions" hidden></div>
    </div>

    <div class="seal-strip">
      <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo COJA7">
    </div>

    <div class="section-label">
      <span class="title">Tous les épisodes</span>
    </div>

    <div id="sermons-list">
      {% if sermons %}
        {% include "emissions/_sermon_rows.html" %}
      {% else %}
      <p>Aucun sermon n'a été publié pour le moment.</p>
      {% endif %}
    </div>

    <a class="load-more"
       data-load-more
       data-url="{{ url_for('emissions.load_more_sermons') }}"
       data-target="#sermons-list"
       data-skeleton="row"
       data-offset="{{ sermons|length }}"
       data-limit="{{ page_size }}"
       {% if sermons|length < page_size %}style="display:none;"{% endif %}>Charger plus</a>
{% endblock %}
