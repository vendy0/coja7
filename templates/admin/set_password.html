{% extends "admin/base_admin.html" %}
{% block page_title %}Définir ton mot de passe{% endblock %}
{% block auth_content %}
<div class="admin-auth-screen">
  <form class="admin-auth-card" id="set-password-form">
    <div class="admin-brand admin-brand-center">
      <img class="admin-brand-mark" src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo COJA7">
      <span class="admin-brand-text">Admin</span>
    </div>
    <p class="admin-auth-sub">Choisis ton mot de passe</p>

    <div id="set-password-feedback" hidden></div>

    <label class="admin-field">
      <span>Nouveau mot de passe</span>
      <input type="password" id="new-password" minlength="8" required>
    </label>
    <label class="admin-field">
      <span>Confirme-le</span>
      <input type="password" id="confirm-password" minlength="8" required>
    </label>
    <button type="submit" class="admin-btn admin-btn-primary admin-btn-block">Valider</button>
  </form>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
  window.SUPABASE_URL = {{ supabase_url | tojson }};
  window.SUPABASE_ANON_KEY = {{ supabase_anon_key | tojson }};
</script>
<script src="{{ url_for('static', filename='js/admin/set-password.js') }}"></script>
{% endblock %}
